<title>Fiscalização Chromebooks</title>
<link rel="manifest" href="manifest.json">

<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b2430;--mut:#667085;--line:#d9dfea;--pri:#1F3864;--priink:#fff;--ok:#1e7d3a;--okbg:#e3f4e8;--bad:#b42318;--badbg:#fde8e6;--warn:#8a5a00;--warnbg:#fff3d6;--inp:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#10151d;--card:#18202b;--ink:#e8edf5;--mut:#9aa6b8;--line:#2a3646;--pri:#5b8def;--priink:#0b1220;--ok:#6fd48a;--okbg:#14301d;--bad:#ff8a80;--badbg:#3a1a18;--warn:#f5c86a;--warnbg:#3a2e10;--inp:#0f1620}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:var(--priink);padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:inherit;border-radius:8px;padding:6px 10px}
main{padding:12px 16px 90px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mut);font-size:13px;font-weight:600}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}
.sp{justify-content:space-between}
h2{font-size:15px;margin:14px 0 8px}h3{font-size:14px;margin:0 0 6px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--inp);color:var(--ink);font:inherit}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
button.b{background:var(--pri);color:var(--priink);border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600}
button.b.s{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.b.d{background:var(--bad);color:#fff}
button.sm{padding:6px 10px;font-size:13px}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.t-ok{background:var(--okbg);color:var(--ok)}.t-bad{background:var(--badbg);color:var(--bad)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-n{background:var(--line);color:var(--mut)}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.kpi b{font-size:22px;display:block}
.cmp{width:100%;border-collapse:collapse;font-size:13px}.cmp td,.cmp th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}.cmp td:first-child,.cmp th:first-child{text-align:left}
.bad{color:var(--bad);font-weight:700}.good{color:var(--ok);font-weight:700}
.item{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.chk{display:flex;gap:10px;align-items:center;padding:7px 0}.chk input{width:22px;height:22px;flex:none}
canvas.sig{width:100%;height:150px;border:1px dashed var(--mut);border-radius:8px;background:#fff;touch-action:none}
.photos{display:flex;gap:6px;flex-wrap:wrap}.photos img{width:72px;height:72px;object-fit:cover;border-radius:8px}
#scan{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#scan video{flex:1;object-fit:cover;width:100%}#scan .bar{padding:12px;display:flex;gap:8px;background:#000}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:#222;color:#fff;border-radius:10px;padding:9px 14px;z-index:30;display:none;max-width:90%}
#printarea{display:none}
@media print{body>*:not(#printarea){display:none!important}#printarea{display:block;color:#000;background:#fff;font:11pt Arial,sans-serif}
#printarea table{border-collapse:collapse;width:100%}#printarea td,#printarea th{border:1px solid #000;padding:4px 6px;font-size:10pt;text-align:left}
#printarea h1,#printarea h2,#printarea p{text-align:center;margin:2px 0}#printarea .l{text-align:left}}
</style>

const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('fiscal-chromebooks',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 get(k){return new Promise(res=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})},
 set(k,v){return new Promise(res=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res()})}};

/* ===== Regras de conferência ===== */
function checkItem(inep,it){
  const f=[];const s=norm(it.serie);
  if(it.tipo==='CB'){
    if(s){const p=SERIES.get(s);
      if(SERIES.size&&!p)f.push('Série NÃO consta na relação da Positivo');
      const al=S.almoxItems[s];
      if(Object.keys(S.almoxItems).length){
        if(!al)f.push('Série não consta na lista do Almoxarifado');
        else if(al.inep!==String(inep))f.push('Almoxarifado enviou para outra escola (INEP '+al.inep+')');
        else if(it.tomb&&al.tomb&&norm(al.tomb)!==norm(it.tomb))f.push('Tombamento difere do Almoxarifado ('+al.tomb+')');
      }
      let dup=0;for(const k in S.visits)for(const x of S.visits[k].items)if(x!==it&&x.tipo==='CB'&&norm(x.serie)===s)dup++;
      if(dup)f.push('Série duplicada');
    }
  }
  if(it.tomb){let d=0;for(const k in S.visits)for(const x of S.visits[k].items)if(x!==it&&norm(x.tomb)===norm(it.tomb)&&x.tipo===it.tipo)d++;if(d)f.push('Tombamento duplicado')}
  if(it.estado&&it.estado!=='ok')f.push(ESTADOS[it.estado]);
  return f;
}
function diverg(inep){
  const e=byInep[inep],v=V(inep),a=almoxQ(inep),d=[];
  const cmp=(nome,p,al,c)=>{
    if(al!=null&&al!==p)d.push(`${nome}: previsto ${p} ≠ Almoxarifado ${al}`);
    if(c!=null&&al!=null&&c!==al)d.push(`${nome}: Almoxarifado ${al} ≠ contado ${c}`);
    if(c!=null&&c!==p)d.push(`${nome}: previsto ${p} ≠ contado ${c}`);
  };
  cmp('Chromebooks',prevCB(e),a.cb,v.contCB);cmp('Estações',prevEst(e),a.est,v.contEst);
  let bad=0;for(const it of v.items)if(checkItem(inep,it).length)bad++;
  if(bad)d.push(`${bad} item(ns) com ocorrência`);
  return d;
}
function status(inep){
  const v=S.visits[inep];
  if(!v||(v.contCB==null&&!v.items.length&&v.contEst==null))return'pendente';
  if(!v.concluida)return'andamento';
  return diverg(inep).length?'divergencia':'confere';
}

function bindEscola(inep){
  const v=V(inep);

  document.querySelectorAll('[data-f]').forEach(el=>{
    el.onchange=()=>{const k=el.dataset.f;let x=el.value;
      if(['almoxCB','almoxEst','contCB','contEst','pct'].includes(k))x=num(x);
      v[k]=x;touch(inep);if(['modo','almoxCB','almoxEst','contCB','contEst'].includes(k))render()};
  });
  document.querySelectorAll('[data-chk]').forEach(el=>el.onchange=()=>{v.checks[el.dataset.chk]=el.checked;save()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Excluir este item?')){v.items.splice(+b.dataset.del,1);touch(inep);render()}});
  const c=document.querySelector('[data-act=concluir]');if(c)c.onclick=()=>{v.concluida=!v.concluida;if(v.concluida&&!v.data)v.data=nowLocal();touch(inep);render()};
  const add=$('#n-add');
  if(add){
    const ser=$('#n-serie'),prev=()=>{const it={tipo:$('#n-tipo').value,serie:ser.value,tomb:$('#n-tomb').value,estado:$('#n-est').value};const f=ser.value||it.tomb?checkItem(inep,it):[];const p=SERIES.get(norm(ser.value));
      $('#n-prev').innerHTML=(p?`NF ${p[0]} · TRD ${p[1]}<br>`:'')+(f.length?f.map(x=>`<span class="bad">• ${esc(x)}</span>`).join('<br>'):(ser.value?'<span class="good">Confere</span>':''))};
    ['n-serie','n-tomb','n-tipo','n-est'].forEach(id=>$('#'+id).oninput=prev);
    add.onclick=()=>{const it={tipo:$('#n-tipo').value,serie:norm(ser.value),tomb:$('#n-tomb').value.trim(),estado:$('#n-est').value,obs:$('#n-obs').value.trim()};
      if(!it.serie&&!it.tomb){toast('Informe série ou tombamento');return}
      if(v.items.some(x=>x.tipo===it.tipo&&it.serie&&norm(x.serie)===it.serie)){toast('Série já registrada nesta escola');return}
      v.items.unshift(it);touch(inep);render();toast('Adicionado');setTimeout(()=>{const s=$('#n-serie');s&&s.focus()},50)};
    $('#n-scan').onclick=()=>scan(code=>{ser.value=norm(code);prev();$('#n-tomb').focus()});
  }
  const ph=$('#ph');if(ph)ph.onchange=async()=>{for(const f of ph.files){v.fotos.push(await shrink(f));(v.fotoUrl=v.fotoUrl||[]).push('')}touch(inep);render()};
  document.querySelectorAll('[data-ph]').forEach(i=>i.onclick=()=>{if(confirm('Excluir a foto?')){v.fotos.splice(+i.dataset.ph,1);(v.fotoUrl||[]).splice(+i.dataset.ph,1);touch(inep);render()}});
  const cv=$('#sig');if(cv)sign(cv,v,inep);
  const at=$('#ataBtn');if(at)at.onclick=()=>ata(inep);
}
function nowLocal(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(file)})}
function sign(cv,v,inep){
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2;x.lineCap='round';x.strokeStyle='#000';
  if(v.assin){const im=new Image();im.onload=()=>x.drawImage(im,0,0,r.width,r.height);im.src=v.assin}
  let d=false;const p=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{d=true;cv.setPointerCapture(e.pointerId);const[a,b]=p(e);x.beginPath();x.moveTo(a,b)};
  cv.onpointermove=e=>{if(!d)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke()};
  cv.onpointerup=()=>{if(!d)return;d=false;v.assin=cv.toDataURL('image/png');v.assinUrl='';touch(inep)};
  $('#sigx').onclick=()=>{x.clearRect(0,0,r.width,r.height);v.assin='';v.assinUrl='';touch(inep)};
}

/* ===== Leitura de código de barras ===== */
let stream=null;
async function scan(cb){
  if(!('BarcodeDetector' in window)){toast('Este navegador não lê código de barras. Digite a série.');return}
  try{
    const det=new BarcodeDetector({formats:['code_128','code_39','qr_code','ean_13','data_matrix','codabar']});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const vid=$('#vid');vid.srcObject=stream;await vid.play();$('#scan').style.display='flex';
    let run=true;const stop=()=>{run=false;stream.getTracks().forEach(t=>t.stop());$('#scan').style.display='none'};
    $('#scanx').onclick=stop;
    (async function loop(){while(run){try{const r=await det.detect(vid);if(r.length){const c=r[0].rawValue;stop();cb(c);return}}catch(e){}await new Promise(r=>setTimeout(r,250))}})();
  }catch(e){toast('Câmera indisponível. Digite a série.')}
}

function parseCSV(txt){
  txt=txt.replace(/^﻿/,'');const first=txt.split(/\r?\n/)[0]||'';const sep=first.split(';').length>=first.split(',').length?';':',';
  return txt.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(sep).map(c=>c.replace(/^"|"$/g,'').trim()));
}
const readTxt=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsText(f,'utf-8')});
function dl(name,txt,type){const b=new Blob([txt],{type:type||'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const csvl=r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';');

/* ===== Sincronização ===== */
const cfgOK=()=>S.meta.url&&S.meta.token&&S.meta.device;
function imgPending(v){return (v.fotos||[]).some((f,i)=>!(v.fotoUrl&&v.fotoUrl[i]))||!!(v.assin&&!v.assinUrl)}
function pending(){let n=0;for(const k in S.visits){const v=S.visits[k];if(v.dirty||imgPending(v))n++}return n}
let syncing=false;
function syncChip(){const b=$('#sync');if(!b)return;const n=pending();
  b.textContent=!cfgOK()?'Sync ⚙':syncing?'Sincronizando…':!navigator.onLine?('Offline'+(n?' · '+n:'')):n?('⟳ '+n+' pend.'):'✓ Sincronizado'}
async function api(action,body){const c=new AbortController(),t=setTimeout(()=>c.abort(),90000);
  try{const r=await fetch(S.meta.url,{method:'POST',body:JSON.stringify(Object.assign({action,token:S.meta.token,device:S.meta.device},body)),signal:c.signal});
    const j=await r.json();if(!j.ok)throw new Error(j.error==='token'?'token inválido':(j.error||'erro'));return j}finally{clearTimeout(t)}}
function lite(v){const o=JSON.parse(JSON.stringify(Object.assign({},v,{fotos:[],assin:'',fotoUrl:[],assinUrl:'',dirty:false})));o.nFotos=(v.fotos||[]).length;o.temAssin=!!v.assin;return o}
function summary(inep){const e=byInep[inep],v=V(inep),a=almoxQ(inep);let b=0;for(const it of v.items)if(checkItem(inep,it).length)b++;
  return{escola:e[2],municipio:e[0],prev_cb:prevCB(e),almox_cb:a.cb,cont_cb:v.contCB,prev_est:prevEst(e),almox_est:a.est,cont_est:v.contEst,n_itens:v.items.length,n_ocorr:b,situacao:STAT[status(inep)][0],divergencias:diverg(inep).join(' | '),data:v.data,resp:v.resp,cargo:v.cargo,ocorr:v.ocorr}}
function itemsOut(inep,v){return v.items.map(it=>{const p=SERIES.get(norm(it.serie))||['',''];return{tipo:it.tipo,serie:it.serie,tomb:it.tomb,nf:p[0],trd:p[1],estado:ESTADOS[it.estado]||'',ocorr:checkItem(inep,it).join(' | '),obs:it.obs||''}})}
function adopt(k,rv,rec){const l=S.visits[k];const nv=Object.assign({},rv);nv.fotos=l?l.fotos:[];nv.fotoUrl=l?l.fotoUrl:[];nv.assin=l?l.assin:'';nv.assinUrl=l?l.assinUrl:'';nv.dirty=false;nv.srv=rec;S.visits[k]=nv}
async function sync(manual){
  if(syncing)return;
  if(!cfgOK()){if(manual)toast('Configure a sincronização em Dados');return}
  if(!navigator.onLine){if(manual)toast('Sem internet');syncChip();return}
  syncing=true;syncChip();let pushed=0,files=0,pulled=0,conf=false;
  try{
    for(const k of Object.keys(S.visits)){const v=S.visits[k];if(!v.dirty)continue;const sent=v.updated;
      const r=await api('pushVisit',{inep:k,updated:sent,base:v.srv||0,visit:lite(v),summary:summary(k),items:itemsOut(k,v)});
      if(r.conflict){conf=true;adopt(k,r.server,r.received);toast('Conflito na escola '+k+': prevaleceu a conferência mais recente ('+r.device+')')}
      else{if(v.updated===sent)v.dirty=false;v.srv=r.received;pushed++}
      save()}
    for(const k of Object.keys(S.visits)){const v=S.visits[k];
      for(let i=0;i<(v.fotos||[]).length;i++)if(!(v.fotoUrl&&v.fotoUrl[i])){const r=await api('pushFile',{inep:k,kind:'foto',idx:i,dataUrl:v.fotos[i]});(v.fotoUrl=v.fotoUrl||[])[i]=r.url;files++;save()}
      if(v.assin&&!v.assinUrl){const r=await api('pushFile',{inep:k,kind:'assinatura',idx:0,dataUrl:v.assin});v.assinUrl=r.url;files++;save()}}
    const full=manual||!S.meta.lastAlmox||Date.now()-S.meta.lastAlmox>6*3600e3;
    const r=await api('pull',{since:S.meta.lastPull||0,almox:full});
    for(const x of r.visits||[]){const v=S.visits[x.inep];if(v&&v.dirty)continue;if(v&&(v.srv||0)>=x.received)continue;adopt(x.inep,x.visit,x.received);pulled++}
    if(r.almoxQtd)Object.assign(S.almoxQtd,r.almoxQtd);
    if(r.almoxItems){Object.assign(S.almoxItems,r.almoxItems);S.meta.lastAlmox=Date.now()}
    S.meta.lastPull=r.now;S.meta.lastSync=Date.now();save();
    if(manual)toast(`Enviadas: ${pushed} conferência(s), ${files} arquivo(s). Recebidas: ${pulled}.`);
  }catch(e){if(manual)toast('Falha na sincronização: '+e.message)}
  finally{syncing=false;syncChip();if(conf||((manual||pulled)&&!view.inep))render()}
}
window.addEventListener('online',()=>{syncChip();sync(false)});window.addEventListener('offline',syncChip);
setInterval(()=>{if(navigator.onLine&&cfgOK()&&pending()>0)sync(false)},60000);
$('#sync').onclick=()=>cfgOK()?sync(true):go('dados');
function touch(inep){const v=V(inep);v.updated=Date.now();v.dirty=true;save();syncChip();clearTimeout(touch.t);touch.t=setTimeout(()=>sync(false),6000)}

/* ===== Início ===== */
(async function(){
  try{await DB.open();S=Object.assign(S,await DB.get('state')||{});const ar=await DB.get('series');if(ar)SERIES=new Map(ar.map(r=>[r[0],[r[1],r[2]]]))}catch(e){toast('Armazenamento indisponível: os dados não serão salvos')}
  S.meta=Object.assign({url:'',token:'',device:'',lastPull:0,lastSync:0,lastAlmox:0},S.meta||{});
  render();syncChip();if(cfgOK()&&navigator.onLine)setTimeout(()=>sync(false),2500);
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
