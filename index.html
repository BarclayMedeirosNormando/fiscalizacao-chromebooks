<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>Fiscalização Chromebooks</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b2430;--mut:#667085;--line:#d9dfea;--pri:#1F3864;--priink:#fff;--ok:#1e7d3a;--okbg:#e3f4e8;--bad:#b42318;--badbg:#fde8e6;--warn:#8a5a00;--warnbg:#fff3d6;--inp:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#10151d;--card:#18202b;--ink:#e8edf5;--mut:#9aa6b8;--line:#2a3646;--pri:#5b8def;--priink:#0b1220;--ok:#6fd48a;--okbg:#14301d;--bad:#ff8a80;--badbg:#3a1a18;--warn:#f5c86a;--warnbg:#3a2e10;--inp:#0f1620}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:var(--priink);padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:inherit;border-radius:8px;padding:6px 10px}
main{padding:12px 16px 90px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mut);font-size:13px;font-weight:600}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}
.sp{justify-content:space-between}
h2{font-size:15px;margin:14px 0 8px}h3{font-size:14px;margin:0 0 6px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--inp);color:var(--ink);font:inherit}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
button.b{background:var(--pri);color:var(--priink);border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600}
button.b.s{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.b.d{background:var(--bad);color:#fff}
button.sm{padding:6px 10px;font-size:13px}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.t-ok{background:var(--okbg);color:var(--ok)}.t-bad{background:var(--badbg);color:var(--bad)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-n{background:var(--line);color:var(--mut)}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.kpi b{font-size:22px;display:block}
.cmp{width:100%;border-collapse:collapse;font-size:13px}.cmp td,.cmp th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}.cmp td:first-child,.cmp th:first-child{text-align:left}
.bad{color:var(--bad);font-weight:700}.good{color:var(--ok);font-weight:700}
.item{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.chk{display:flex;gap:10px;align-items:center;padding:7px 0}.chk input{width:22px;height:22px;flex:none}
canvas.sig{width:100%;height:150px;border:1px dashed var(--mut);border-radius:8px;background:#fff;touch-action:none}
.photos{display:flex;gap:6px;flex-wrap:wrap}.photos img{width:72px;height:72px;object-fit:cover;border-radius:8px}
#scan{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#scan video{flex:1;object-fit:cover;width:100%}#scan .bar{padding:12px;display:flex;gap:8px;background:#000}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:#222;color:#fff;border-radius:10px;padding:9px 14px;z-index:30;display:none;max-width:90%}
#printarea{display:none}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px}
#login .box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
#login h2{margin:0 0 2px;font-size:18px}.msg{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
@media print{body>*:not(#printarea){display:none!important}#printarea{display:block;color:#000;background:#fff;font:11pt Arial,sans-serif}
#printarea table{border-collapse:collapse;width:100%}#printarea td,#printarea th{border:1px solid #000;padding:4px 6px;font-size:10pt;text-align:left}
#printarea h1,#printarea h2,#printarea p{text-align:center;margin:2px 0}#printarea .l{text-align:left}}
</style>
</head>
<body>
<header><button id="back" style="display:none">‹ Voltar</button><h1 id="title">Fiscalização Chromebooks</h1><button id="sync" style="font-size:12px"></button><button id="menu">⋯</button></header>
<main id="app"></main>
<nav><button data-t="escolas" class="on">Escolas</button><button data-t="painel">Painel</button><button data-t="dados">Dados</button></nav>
<div id="scan"><video id="vid" playsinline muted></video><div class="bar"><button class="b s" id="scanx" style="flex:1;color:#fff;border-color:#fff">Fechar</button></div></div>
<div id="login"><div class="box"><h2>Fiscalização Chromebooks</h2><div class="mut">Contrato nº 0029/2026 · acesso restrito</div>
<div id="l-srv"><label>Endereço do servidor (termina em /exec)</label><input id="l-url" autocapitalize="off" autocomplete="off"></div>
<div id="l-form"><label>Matrícula</label><input id="l-mat" inputmode="numeric" autocomplete="username"><label>Senha</label><input id="l-pw" type="password" autocomplete="current-password">
<div style="margin-top:12px"><button class="b" id="l-go" style="width:100%">Entrar</button></div></div>
<div id="l-troca" style="display:none"><label>Nova senha (mínimo 8 caracteres)</label><input id="l-n1" type="password" autocomplete="new-password"><label>Repita a nova senha</label><input id="l-n2" type="password" autocomplete="new-password">
<div style="margin-top:12px"><button class="b" id="l-ok" style="width:100%">Salvar nova senha</button></div></div>
<div class="msg" id="l-msg"></div></div></div>
<div id="toast"></div>
<div id="printarea"></div>
<script>
/* ===== Dados embutidos: Anexo V (597 escolas) =====
   [município, INEP, escola, zona, fomento, estações de recarga, Chromebooks por estação, Chromebooks] */
let ESCOLAS=[];let byInep={};
function setEscolas(a){ESCOLAS=a;byInep=Object.fromEntries(a.map(e=>[e[1],e]))}
const DEFAULT_URL=atob('aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J4OS0tMXF0N1B2WEJCVklpaUYySk93NU9HcDdqWmNMZ2NObkQ3VkMxUFhkcmdTX1V0bnpZcFBjVnktak5scUgwZkFkUS9leGVj');
const FISCAL={nome:'',cargo:'',mat:''};
let SERV=[];  // [matrícula, nome, nome normalizado]
const fold=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function setServ(a){SERV=a.map(r=>[String(r[0]),String(r[1]),fold(r[1])])}
function buscaServ(q){q=String(q||'').trim();if(q.length<2||!SERV.length)return[];
  const out=[];
  if(/^\d+$/.test(q)){for(const r of SERV){if(r[0].startsWith(q)||(q.length>=4&&r[0].includes(q))){out.push(r);if(out.length>=8)break}}return out}
  const t=fold(q).split(/\s+/).filter(Boolean);
  for(const r of SERV){if(t.every(x=>r[2].includes(x))){out.push(r);if(out.length>=8)break}}return out}
const isAdmin=()=>!!(S.meta.user&&S.meta.user.perfil==='admin');
function setFiscal(){const u=S.meta.user;if(!u)return;const m=String(u.mat);FISCAL.nome=u.nome;FISCAL.mat=m.length===7?m.slice(0,3)+'.'+m.slice(3,6)+'-'+m.slice(6):m;FISCAL.cargo=u.perfil==='admin'?'Fiscal do Contrato nº 0029/2026':'Técnico – Fiscalização do Contrato nº 0029/2026'}
const CHECKS=[
 ['qtd','Quantidade e volumes conforme Anexo V / saída do Almoxarifado'],
 ['mod','Modelo N2320 (Anexo I)'],
 ['est','Equipamentos novos, sem avaria; embalagem e lacre íntegros (Anexo I 11.7.1)'],
 ['acc','Acessórios: capa, cabo de segurança e fonte bivolt identificada (Anexo I 7.6.5, 8.1, 8.2)'],
 ['slot','Slot de tranca de segurança presente (Anexo I 7.7)'],
 ['anatel','Selo Anatel no equipamento ou na BIOS (Anexo I 11.5.2)'],
 ['serie','Números de série conferidos com a relação da Positivo (TR 6.6.2)'],
 ['os','ChromeOS inicia normalmente (Anexo I 10.1)'],
 ['tela','Tela, teclado, touchpad e webcam funcionando (Anexo I 6 e 7)'],
 ['conec','Wi-Fi, Bluetooth, USB-C e USB-A funcionando (Anexo I 1.4, 1.5, 3)'],
 ['bat','Carrega com a fonte fornecida (Anexo I 7.5, 7.6)'],
 ['foto','Registro fotográfico realizado (facultativo – TR 6.6.3)']];
const ESTADOS={ok:'OK',avaria:'Avariado',modelo:'Modelo diferente',acess:'Acessório faltando',outro:'Outro'};

/* ===== Armazenamento (IndexedDB) ===== */
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('fiscal-chromebooks',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 get(k){return new Promise(res=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})},
 set(k,v){return new Promise(res=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res()})}};
let S={visits:{},almoxItems:{},almoxQtd:{},meta:{}};   // estado salvo
let SERIES=new Map();                                  // série -> [nf, trd]
let view={t:'escolas',inep:null,q:'',tab:'resumo',filtro:'todas'};
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>DB.set('state',S),250)}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toUpperCase().replace(/\s+/g,'').trim();
const num=v=>v===''||v==null||isNaN(+v)?null:+v;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
const prevCB=e=>e[7], prevEst=e=>e[5];

function V(inep){
  if(!S.visits[inep])S.visits[inep]={almoxCB:null,almoxEst:null,contCB:null,contEst:null,modo:'amostra',pct:10,items:[],checks:{},ocorr:'',fotos:[],assin:'',resp:'',cargo:'',data:'',concluida:false};
  return S.visits[inep];
}
function almoxQ(inep){const q=S.almoxQtd[inep];const v=V(inep);return{cb:v.almoxCB??(q?q.cb:null),est:v.almoxEst??(q?q.est:null),data:q&&q.data?q.data:''}}

/* ===== Regras de conferência ===== */
function checkItem(inep,it){
  const f=[];const s=norm(it.serie);
  if(it.tipo==='CB'){
    if(s){const p=SERIES.get(s);
      if(SERIES.size&&!p)f.push('Série NÃO consta na relação da Positivo');
      const al=S.almoxItems[s];
      if(Object.keys(S.almoxItems).length){
        if(!al)f.push('Série não consta na lista do Almoxarifado');
        else if(al.inep!==String(inep))f.push('Almoxarifado enviou para outra escola (INEP '+al.inep+')');
        else if(it.tomb&&al.tomb&&norm(al.tomb)!==norm(it.tomb))f.push('Tombamento difere do Almoxarifado ('+al.tomb+')');
      }
      let dup=0;for(const k in S.visits)for(const x of S.visits[k].items)if(x!==it&&x.tipo==='CB'&&norm(x.serie)===s)dup++;
      if(dup)f.push('Série duplicada');
    }
  }
  if(it.tomb){let d=0;for(const k in S.visits)for(const x of S.visits[k].items)if(x!==it&&norm(x.tomb)===norm(it.tomb)&&x.tipo===it.tipo)d++;if(d)f.push('Tombamento duplicado')}
  if(it.estado&&it.estado!=='ok')f.push(ESTADOS[it.estado]);
  return f;
}
function diverg(inep){
  const e=byInep[inep],v=V(inep),a=almoxQ(inep),d=[];
  const cmp=(nome,p,al,c)=>{
    if(al!=null&&al!==p)d.push(`${nome}: previsto ${p} ≠ Almoxarifado ${al}`);
    if(c!=null&&al!=null&&c!==al)d.push(`${nome}: Almoxarifado ${al} ≠ contado ${c}`);
    if(c!=null&&c!==p)d.push(`${nome}: previsto ${p} ≠ contado ${c}`);
  };
  cmp('Chromebooks',prevCB(e),a.cb,v.contCB);cmp('Estações',prevEst(e),a.est,v.contEst);
  let bad=0;for(const it of v.items)if(checkItem(inep,it).length)bad++;
  if(bad)d.push(`${bad} item(ns) com ocorrência`);
  return d;
}
function status(inep){
  const v=S.visits[inep];
  if(!v||(v.contCB==null&&!v.items.length&&v.contEst==null))return'pendente';
  if(!v.concluida)return'andamento';
  return diverg(inep).length?'divergencia':'confere';
}
const STAT={pendente:['Pendente','t-n'],andamento:['Em andamento','t-warn'],confere:['Confere','t-ok'],divergencia:['Divergência','t-bad']};
function amostraAlvo(v){const t=v.contCB??0;return v.modo==='todos'?t:Math.min(t,Math.max(t?1:0,Math.ceil(t*(+v.pct||0)/100)))}

/* ===== Marcação automática dos itens verificados ===== */
const AUTO_CHK=['qtd','mod','est','acc','serie','foto'];
function autoChecks(inep){const v=V(inep),e=byInep[inep];if(!e)return false;v.man=v.man||{};v.auto=v.auto||{};
  const a=almoxQ(inep),cbs=v.items.filter(i=>i.tipo==='CB'),alvo=amostraAlvo(v),amostra=cbs.length>0&&cbs.length>=alvo;
  const want={
    qtd:v.contCB!=null&&v.contEst!=null&&v.contCB===prevCB(e)&&v.contEst===prevEst(e)&&(a.cb==null||a.cb===v.contCB)&&(a.est==null||a.est===v.contEst),
    serie:amostra&&SERIES.size>0&&cbs.every(i=>i.serie&&SERIES.has(norm(i.serie))&&!checkItem(inep,i).some(m=>/^(Série|Tombamento|Almoxarifado)/.test(m))),
    mod:amostra&&!cbs.some(i=>i.estado==='modelo')&&(!SERIES.size||cbs.every(i=>SERIES.has(norm(i.serie)))),
    est:amostra&&!v.items.some(i=>i.estado==='avaria'),
    acc:amostra&&!v.items.some(i=>i.estado==='acess'),
    foto:(v.fotos||[]).length>0};
  let ch=false;
  for(const k of AUTO_CHK){if(v.man[k])continue;const val=!!want[k];if(!val&&!v.auto[k])continue;
    if(!!v.checks[k]!==val||!!v.auto[k]!==val){v.checks[k]=val;v.auto[k]=val;ch=true}}
  return ch}

/* ===== Navegação ===== */
function go(t,inep){view.t=t;view.inep=inep||null;if(inep)view.tab='resumo';render();window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
$('#back').onclick=()=>go('escolas');
$('#menu').onclick=()=>go('dados');

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===(view.inep?'escolas':view.t)));
  $('#back').style.display=view.inep?'':'none';
  const m=$('#app');
  if(view.inep){const e=byInep[view.inep];$('#title').textContent=e[2];m.innerHTML=escola(view.inep);bindEscola(view.inep)}
  else if(view.t==='painel'){$('#title').textContent='Painel';m.innerHTML=painel()}
  else if(view.t==='dados'){$('#title').textContent='Dados e exportação';m.innerHTML=dados();bindDados()}
  else{$('#title').textContent='Escolas';m.innerHTML=lista();bindLista()}
}

/* ===== Lista de escolas ===== */
function lista(){
  const q=norm(view.q).toLowerCase();
  let arr=ESCOLAS.filter(e=>!q||(e[0]+' '+e[1]+' '+e[2]).toLowerCase().includes(view.q.toLowerCase().trim()));
  if(view.filtro!=='todas')arr=arr.filter(e=>status(e[1])===view.filtro);
  const tot=arr.length;arr=arr.slice(0,80);
  return (ESCOLAS.length?'':`<div class="card"><b class="bad">Nenhuma escola carregada.</b><div class="mut">Conecte-se à internet e toque em Sincronizar. ${isAdmin()?'Como administrador, envie antes a lista de escolas em Dados.':''}</div></div>`)+`<input id="q" type="search" placeholder="Buscar escola, município ou INEP" value="${esc(view.q)}">
  <div class="row" style="margin:8px 0;flex-wrap:wrap">${['todas','pendente','andamento','confere','divergencia'].map(f=>`<button class="b sm ${view.filtro===f?'':'s'}" data-f="${f}">${f==='todas'?'Todas':STAT[f][0]}</button>`).join('')}</div>
  <div class="mut" style="margin-bottom:6px">${tot} escola(s)${tot>80?' – mostrando 80, refine a busca':''}</div>`+
  arr.map(e=>{const s=status(e[1]);return `<div class="card" data-i="${e[1]}" style="cursor:pointer"><div class="row sp"><b>${esc(e[2])}</b><span style="text-align:right"><span class="tag ${STAT[s][1]}">${STAT[s][0]}</span>${isAdmin()&&s!=='pendente'?`<br><button class="b sm s" data-reset="${e[1]}" style="margin-top:6px">Resetar</button>`:''}</span></div>
  <div class="mut">${esc(e[0])} · INEP ${e[1]} · ${e[3].toLowerCase()}</div><div class="mut">Previsto: ${prevCB(e)} Chromebooks · ${prevEst(e)} estações</div></div>`}).join('');
}
function bindLista(){
  const q=$('#q');q.oninput=()=>{view.q=q.value;const p=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{view.filtro=b.dataset.f;render()});
  document.querySelectorAll('[data-i]').forEach(c=>c.onclick=()=>go('escolas',c.dataset.i));
  document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=e=>{e.stopPropagation();resetVisita(b.dataset.reset)});
}

/* ===== Tela da escola ===== */
function dif(a,b){return a==null||b==null?'–':(b-a)}
function cell(a,b){const d=dif(a,b);return d==='–'?'<td>–</td>':`<td class="${d===0?'good':'bad'}">${d>0?'+'+d:d}</td>`}
function escola(inep){if(autoChecks(inep))save();
  const e=byInep[inep],v=V(inep),a=almoxQ(inep),s=status(inep);
  const tabs=[['resumo','Quantidades'],['itens','Equipamentos'],['ata','Ata']];
  let h=`<div class="card"><div class="row sp"><div><b>${esc(e[2])}</b><div class="mut">${esc(e[0])} · INEP ${inep} · ${e[3].toLowerCase()}</div></div><span style="text-align:right"><span class="tag ${STAT[s][1]}">${STAT[s][0]}</span>${isAdmin()&&s!=='pendente'?`<br><button class="b sm s" data-reset="${inep}" style="margin-top:6px">Resetar</button>`:''}</span></div></div>
  <div class="row" style="margin-bottom:10px">${tabs.map(t=>`<button class="b sm ${view.tab===t[0]?'':'s'}" style="flex:1" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>`;
  if(view.tab==='resumo')h+=tabResumo(inep,e,v,a);
  else if(view.tab==='itens')h+=tabItens(inep,e,v);
  else h+=tabAta(inep,e,v);
  return h;
}
function tabResumo(inep,e,v,a){
  const d=diverg(inep);
  return `<div class="card"><h3>Quantidades</h3>
  <table class="cmp"><tr><th></th><th>Previsto (Anexo V)</th><th>Almoxarifado</th><th>Contado</th></tr>
  <tr><td>Chromebooks</td><td>${prevCB(e)}</td><td><input type="number" inputmode="numeric" data-f="almoxCB" value="${a.cb??''}" placeholder="–"></td><td><input type="number" inputmode="numeric" data-f="contCB" value="${v.contCB??''}" placeholder="–"></td></tr>
  <tr><td>Estações de recarga</td><td>${prevEst(e)}</td><td><input type="number" inputmode="numeric" data-f="almoxEst" value="${a.est??''}" placeholder="–"></td><td><input type="number" inputmode="numeric" data-f="contEst" value="${v.contEst??''}" placeholder="–"></td></tr></table>
  <div class="mut" style="margin-top:6px">Anexo V: ${e[6]} Chromebooks por estação. ${a.data?'Saída do Almoxarifado: '+esc(a.data)+'.':'Almoxarifado pré-preenchido quando a saída é importada em "Dados".'}</div></div>

function nowLocal(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(file)})}
function sign(cv,v,inep){
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2;x.lineCap='round';x.strokeStyle='#000';
  if(v.assin){const im=new Image();im.onload=()=>x.drawImage(im,0,0,r.width,r.height);im.src=v.assin}
  let d=false;const p=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{d=true;cv.setPointerCapture(e.pointerId);const[a,b]=p(e);x.beginPath();x.moveTo(a,b)};
  cv.onpointermove=e=>{if(!d)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke()};
  cv.onpointerup=()=>{if(!d)return;d=false;v.assin=cv.toDataURL('image/png');v.assinUrl='';touch(inep)};
  $('#sigx').onclick=()=>{x.clearRect(0,0,r.width,r.height);v.assin='';v.assinUrl='';touch(inep)};
}

/* ===== Leitura de código de barras ===== */
let stream=null;
async function scan(cb){
  if(!('BarcodeDetector' in window)){toast('Este navegador não lê código de barras. Digite o código.');return}
  try{
    const det=new BarcodeDetector({formats:['code_128','code_39','qr_code','ean_13','data_matrix','codabar']});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const vid=$('#vid');vid.srcObject=stream;await vid.play();$('#scan').style.display='flex';
    let run=true;const stop=()=>{run=false;stream.getTracks().forEach(t=>t.stop());$('#scan').style.display='none'};
    $('#scanx').onclick=stop;
    (async function loop(){while(run){try{const r=await det.detect(vid);if(r.length){const c=r[0].rawValue;stop();cb(c);return}}catch(e){}await new Promise(r=>setTimeout(r,250))}})();
  }catch(e){toast('Câmera indisponível. Digite a série.')}
}

function parseCSV(txt){
  txt=txt.replace(/^﻿/,'');const first=txt.split(/\r?\n/)[0]||'';const sep=first.split(';').length>=first.split(',').length?';':',';
  return txt.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(sep).map(c=>c.replace(/^"|"$/g,'').trim()));
}

/* ===== Sincronização ===== */
const cfgOK=()=>S.meta.url&&S.meta.session;
function imgPending(v){return (v.fotos||[]).some((f,i)=>!(v.fotoUrl&&v.fotoUrl[i]))||!!(v.assin&&!v.assinUrl)}
function pending(){let n=0;for(const k in S.visits){const v=S.visits[k];if(v.dirty||imgPending(v))n++}return n}
let syncing=false;
function syncChip(){const b=$('#sync');if(!b)return;const n=pending();
  b.textContent=!cfgOK()?'Sync ⚙':syncing?'Sincronizando…':!navigator.onLine?('Offline'+(n?' · '+n:'')):n?('⟳ '+n+' pend.'):'✓ Sincronizado'}
async function api(action,body){const c=new AbortController(),t=setTimeout(()=>c.abort(),90000);
  try{const r=await fetch(S.meta.url,{method:'POST',body:JSON.stringify(Object.assign({action,session:S.meta.session,device:S.meta.device},body)),signal:c.signal});
    let j;try{j=await r.json()}catch(x){throw new Error('Resposta inválida do servidor')}
    if(!j.ok){if(j.error==='sessao'){S.meta.session='';save();showLogin('Sessão expirada. Entre novamente.');throw new Error('sessão expirada')}
      if(j.error==='trocar'){showLogin('Defina uma nova senha para continuar.',true);throw new Error('troca de senha pendente')}
      throw new Error(j.error||'erro')}
    return j}catch(e){if(e.name==='TypeError'||e.name==='AbortError')throw new Error('Sem conexão com o servidor');throw e}finally{clearTimeout(t)}}
function lite(v){const o=JSON.parse(JSON.stringify(Object.assign({},v,{fotos:[],assin:'',fotoUrl:[],assinUrl:'',dirty:false,reset:false})));o.nFotos=(v.fotos||[]).length;o.temAssin=!!v.assin;return o}
function summary(inep){const e=byInep[inep],v=V(inep),a=almoxQ(inep);let b=0;for(const it of v.items)if(checkItem(inep,it).length)b++;
  return{escola:e[2],municipio:e[0],prev_cb:prevCB(e),almox_cb:a.cb,cont_cb:v.contCB,prev_est:prevEst(e),almox_est:a.est,cont_est:v.contEst,n_itens:v.items.length,n_ocorr:b,situacao:STAT[status(inep)][0],divergencias:diverg(inep).join(' | '),data:v.data,resp:v.resp+(v.respMat?' ('+v.respMat+')':''),cargo:v.cargo,ocorr:v.ocorr}}
function itemsOut(inep,v){return v.items.map(it=>{const p=SERIES.get(norm(it.serie))||['',''];return{tipo:it.tipo,serie:it.serie,tomb:it.tomb,nf:p[0],trd:p[1],estado:ESTADOS[it.estado]||'',ocorr:checkItem(inep,it).join(' | '),obs:it.obs||''}})}
function adopt(k,rv,rec){const l=S.visits[k];const nv=Object.assign({},rv);nv.fotos=l?l.fotos:[];nv.fotoUrl=l?l.fotoUrl:[];nv.assin=l?l.assin:'';nv.assinUrl=l?l.assinUrl:'';nv.dirty=false;nv.srv=rec;S.visits[k]=nv}
async function sync(manual){
  if(syncing)return;
  if(!cfgOK()){if(manual)toast('Configure a sincronização em Dados');return}
  if(!navigator.onLine){if(manual)toast('Sem internet');syncChip();return}
  syncing=true;syncChip();let pushed=0,files=0,pulled=0,conf=false;let cfgNew=false;
  try{
    for(const k of Object.keys(S.visits)){const v=S.visits[k];if(!v.dirty)continue;const sent=v.updated;
      const r=await api('pushVisit',{inep:k,updated:sent,base:v.srv||0,reset:!!v.reset,visit:lite(v),summary:summary(k),items:itemsOut(k,v)});
      if(r.conflict){conf=true;adopt(k,r.server,r.received);toast('Conflito na escola '+k+': prevaleceu a conferência mais recente ('+r.device+')')}
      else{if(v.updated===sent){v.dirty=false;v.reset=false}v.srv=r.received;pushed++}
      save()}
    for(const k of Object.keys(S.visits)){const v=S.visits[k];
      for(let i=0;i<(v.fotos||[]).length;i++)if(!(v.fotoUrl&&v.fotoUrl[i])){const r=await api('pushFile',{inep:k,kind:'foto',idx:i,dataUrl:v.fotos[i]});(v.fotoUrl=v.fotoUrl||[])[i]=r.url;files++;save()}
      if(v.assin&&!v.assinUrl){const r=await api('pushFile',{inep:k,kind:'assinatura',idx:0,dataUrl:v.assin});v.assinUrl=r.url;files++;save()}}
    const full=manual||!S.meta.lastAlmox||Date.now()-S.meta.lastAlmox>6*3600e3;
    const cfg=manual||!ESCOLAS.length||!SERIES.size;
    const r=await api('pull',{since:S.meta.lastPull||0,almox:full,cfg,servVer:S.meta.servVer||''});
    if(r.escolas&&r.escolas.length){setEscolas(r.escolas);await DB.set('escolas',r.escolas);cfgNew=true}
    if(r.servidores){setServ(r.servidores);await DB.set('servidores',r.servidores);S.meta.servVer=r.servVer;cfgNew=true}
    if(r.series&&r.series.length){const arr=r.series.map(x=>[norm(x[0]),x[1]||'',x[2]||'']);SERIES=new Map(arr.map(x=>[x[0],[x[1],x[2]]]));await DB.set('series',arr);cfgNew=true}
    for(const x of r.visits||[]){const v=S.visits[x.inep];if(v&&v.dirty)continue;if(v&&(v.srv||0)>=x.received)continue;adopt(x.inep,x.visit,x.received);pulled++}
    if(r.almoxQtd){if(Object.keys(r.almoxQtd).length)S.almoxQtd=r.almoxQtd}
    if(r.almoxItems){Object.assign(S.almoxItems,r.almoxItems);S.meta.lastAlmox=Date.now()}
    S.meta.lastPull=r.now;S.meta.lastSync=Date.now();save();
    if(manual)toast(`Enviadas: ${pushed} conferência(s), ${files} arquivo(s). Recebidas: ${pulled}.`);
  }catch(e){if(manual)toast('Falha na sincronização: '+e.message)}
  finally{syncing=false;syncChip();if(conf||((manual||pulled||cfgNew)&&!view.inep))render()}
}
window.addEventListener('online',()=>{syncChip();sync(false)});window.addEventListener('offline',syncChip);
setInterval(()=>{if(navigator.onLine&&cfgOK()&&pending()>0)sync(false)},60000);

/* ===== Importação da planilha de saídas do Almoxarifado ===== */
const XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const STOPW=new Set('de da do das dos e prof profa professor professora escola estadual ensino fundamental medio cidadao integral tecnica tecnico eeef eefm eeefm eeem ecit eci ecieefm ceeea cria cpm centro profis dep deputado'.split(' '));
const nm=t=>fold(t).replace(/[^a-z0-9]+/g,' ').trim();
const toksN=t=>nm(t).split(' ').filter(x=>x&&!STOPW.has(x));
function ensureXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,er)=>{const sc=document.createElement('script');sc.src=XLSX_URL;sc.onload=ok;sc.onerror=()=>er(new Error('Não foi possível carregar o leitor de planilhas. Verifique a internet.'));document.head.appendChild(sc)})}
function isoSerial(v){if(v instanceof Date)return v.toISOString().slice(0,10);if(typeof v==='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(v||'').trim());return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:''}
const brData=i=>i?i.slice(8,10)+'/'+i.slice(5,7)+'/'+i.slice(0,4):'';
function sugestoes(cidade,dest){const c=nm(cidade),t=new Set(toksN(dest));
  let cand=ESCOLAS.filter(e=>nm(e[0])===c);const naCidade=cand.length>0;if(!naCidade)cand=ESCOLAS;
  const r=cand.map(e=>{const x=new Set(toksN(e[2]));let i=0;t.forEach(k=>{if(x.has(k))i++});return{e,j:i/Math.max(1,new Set([...t,...x]).size)}}).sort((a,b)=>b.j-a.j);
  return{lista:r,naCidade}}
let MAPA=null;
async function importarMapa(f){const box=$('#map-res');if(!f)return;box.innerHTML='<div class="mut">Lendo planilha…</div>';
  try{if(!ESCOLAS.length)throw new Error('Carregue antes a lista de escolas.');
    await ensureXLSX();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const nome=wb.SheetNames.find(n=>/saida/.test(fold(n)));if(!nome)throw new Error('Aba "RELATÓRIO DE SAÍDA" não encontrada.');
    const A=XLSX.utils.sheet_to_json(wb.Sheets[nome],{header:1,raw:true,defval:null});
    const h=A.findIndex(r=>r.some(c=>c&&fold(c).trim()==='destino'));if(h<0)throw new Error('Cabeçalho "Destino" não encontrado.');
    const cab=A[h].map(c=>fold(c).trim()),ix=k=>cab.findIndex(k);
    const I={gre:ix(x=>x==='gre'),dest:ix(x=>x==='destino'),cid:ix(x=>x==='cidade'),est:ix(x=>x.startsWith('gabinete')),cb:ix(x=>x==='chromebooks'),dt:ix(x=>x.startsWith('data')),obs:ix(x=>x==='obs')};
    if(I.dest<0||I.cid<0||I.cb<0)throw new Error('Colunas Destino, Cidade e Chromebooks são obrigatórias.');
    const linhas=A.slice(h+1).filter(r=>r[I.dest]&&typeof r[I.cb]==='number').map(r=>({gre:r[I.gre]||'',dest:String(r[I.dest]).trim(),cid:String(r[I.cid]||'').trim(),est:Number(r[I.est])||0,cb:r[I.cb],dt:isoSerial(r[I.dt]),obs:r[I.obs]?String(r[I.obs]).trim():''}));
    if(!linhas.length)throw new Error('Nenhuma linha de saída encontrada.');
    const mem=(await api('getNomes',{})).nomes||{};
    linhas.forEach(l=>{l.chave=nm(l.cid)+'|'+nm(l.dest);const m=mem[l.chave];if(m){l.inep=m;l.via='memória';return}
      const s=sugestoes(l.cid,l.dest);l.sug=s;const a=s.lista[0],b=s.lista[1];
      if(s.naCidade&&a&&a.j>=0.6&&(!b||a.j-b.j>=0.15)){l.inep=a.e[1];l.via='auto'}});
    MAPA={linhas,nomes:[]};desenhaMapa()}
  catch(x){box.innerHTML=`<div class="bad" style="margin-top:6px">${esc(x.message)}</div>`}}
function desenhaMapa(){const box=$('#map-res'),L=MAPA.linhas,pend=L.filter(l=>!l.inep);
  const tot=L.reduce((a,l)=>a+l.cb,0),est=L.reduce((a,l)=>a+l.est,0);
  box.innerHTML=`<div class="card" style="margin-top:8px"><b>${L.length} saídas · ${tot} Chromebooks · ${est} estações</b><div class="mut">${L.filter(l=>l.inep&&l.inep!=='-').length} reconhecidas · ${pend.length} para confirmar</div>
  ${pend.map((l,i)=>{const op=(l.sug.lista.slice(0,l.sug.naCidade?300:60)).map(r=>`<option value="${r.e[1]}"${r===l.sug.lista[0]&&r.j>=0.3?' selected':''}>${esc(r.e[2])} (${esc(r.e[0])}, ${r.e[7]} CB)</option>`).join('');
    return `<div class="item" style="display:block"><div><b>${esc(l.dest)}</b> <span class="mut">· ${esc(l.cid)} · ${l.cb} CB · ${l.est} est.</span></div>
    <select data-mp="${L.indexOf(l)}"><option value="">Escolha…</option>${op}<option value="-">Ignorar (não é escola)</option></select></div>`}).join('')}
  <div style="margin-top:8px"><button class="b" id="map-ok">Importar saída do Almoxarifado</button></div><div class="mut" id="map-msg" style="margin-top:6px"></div></div>`;
  box.querySelectorAll('[data-mp]').forEach(sel=>{const l=L[+sel.dataset.mp];if(sel.value)l._pre=sel.value;sel.onchange=()=>{l._pre=sel.value}});
  $('#map-ok').onclick=confirmaMapa}
async function confirmaMapa(){const L=MAPA.linhas,msg=$('#map-msg');
  for(const l of L){if(!l.inep){if(!l._pre){msg.innerHTML='<span class="bad">Escolha uma opção em todas as saídas pendentes.</span>';return}
      l.inep=l._pre;MAPA.nomes.push([l.chave,l.inep])}}
  const g={};for(const l of L){if(l.inep==='-')continue;const e=byInep[l.inep];if(!e)continue;
    const o=g[l.inep]||(g[l.inep]={inep:l.inep,escola:e[2],municipio:e[0],gre:l.gre,cb:0,est:0,datas:[],obs:[],linhas:0});
    o.cb+=l.cb;o.est+=l.est;o.linhas++;if(l.dt)o.datas.push(l.dt);if(l.obs&&!o.obs.includes(l.obs))o.obs.push(l.obs)}
  const saidas=Object.values(g).map(o=>{o.datas.sort();const d=o.datas.length?(o.datas[0]===o.datas[o.datas.length-1]?brData(o.datas[0]):brData(o.datas[0])+' a '+brData(o.datas[o.datas.length-1])):'';
    return{inep:o.inep,escola:o.escola,municipio:o.municipio,gre:o.gre,cb:o.cb,est:o.est,data:d,obs:o.obs.join(' | ')}});
  try{msg.textContent='Enviando…';await api('setAlmoxSaidas',{saidas:saidas,nomes:MAPA.nomes});
    const q={};saidas.forEach(x=>q[x.inep]={cb:x.cb,est:x.est,data:x.data});S.almoxQtd=q;save();
    const dv=saidas.filter(x=>{const e=byInep[x.inep];return x.cb!==prevCB(e)||x.est!==prevEst(e)}).length;
    toast(saidas.length+' escolas importadas'+(dv?` (${dv} diferem do Anexo V)`:''));MAPA=null;render()}
  catch(x){msg.innerHTML='<span class="bad">Falha: '+esc(x.message)+'</span>'}}

/* ===== Acesso ===== */
let tmpPw='';
function showLogin(msg,trocar){const lg=$('#login');lg.style.display='flex';$('#l-msg').textContent=msg||'';
  $('#l-srv').style.display=(DEFAULT_URL||(S.meta&&S.meta.url))?'none':'block';$('#l-form').style.display=trocar?'none':'block';$('#l-troca').style.display=trocar?'block':'none'}
function enter(){$('#login').style.display='none';$('#l-pw').value='';setFiscal();render();syncChip();if(navigator.onLine)setTimeout(()=>sync(false),500)}
async function logout(){try{if(navigator.onLine&&S.meta.session)await api('logout',{})}catch(e){}S.meta.session='';S.meta.user=null;save();showLogin('')}
$('#l-go').onclick=async()=>{const m=$('#l-msg');m.textContent='';
  const url=(DEFAULT_URL||$('#l-url').value||S.meta.url).trim();if(!url){m.textContent='Informe o endereço do servidor.';return}
  if(!navigator.onLine){m.textContent='O acesso exige internet. Depois de entrar, o app funciona sem conexão.';return}
  if(!$('#l-mat').value.trim()||!$('#l-pw').value){m.textContent='Informe matrícula e senha.';return}
  S.meta.url=url;$('#l-go').disabled=true;
  try{const pw=$('#l-pw').value,r=await api('login',{mat:$('#l-mat').value,senha:pw});
    const outro=S.meta.user&&S.meta.user.mat!==r.user.mat;S.meta.session=r.session;S.meta.user=r.user;S.meta.lastPull=outro?0:S.meta.lastPull;save();
    if(r.trocar){tmpPw=pw;showLogin('Defina uma nova senha para continuar.',true)}else enter()}
  catch(e){m.textContent=e.message}finally{$('#l-go').disabled=false}};
$('#l-ok').onclick=async()=>{const m=$('#l-msg'),a=$('#l-n1').value,b=$('#l-n2').value;m.textContent='';
  if(a!==b){m.textContent='As senhas não coincidem.';return}
  try{await api('changePassword',{atual:tmpPw,nova:a});tmpPw='';$('#l-n1').value=$('#l-n2').value='';enter()}catch(e){m.textContent=e.message}};
async function loadUsers(){const el=$('#u-list');if(!el)return;
  try{const r=await api('listUsers',{});el.innerHTML=r.users.map(u=>`<div class="item"><div style="flex:1"><b>${esc(u.nome)}</b> <span class="mut">${esc(u.mat)} · ${u.perfil==='admin'?'administrador':'técnico'}${u.ativo?'':' · INATIVO'}${u.trocar?' · senha temporária':''}<br>${esc(u.email||'')}</span></div>
    ${u.perfil==='admin'?'':`<div class="row" style="flex-wrap:wrap;justify-content:flex-end"><button class="b sm s" data-u="reset" data-m="${u.mat}">Redefinir senha</button><button class="b sm s" data-u="ativo" data-a="${u.ativo?0:1}" data-m="${u.mat}">${u.ativo?'Desativar':'Ativar'}</button><button class="b sm d" data-u="del" data-m="${u.mat}">Remover</button></div>`}</div>`).join('')+`<div class="mut" style="margin-top:6px">${r.users.length} de ${r.max} usuários.</div>`;
    el.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{const m=b.dataset.m,k=b.dataset.u;try{
      if(k==='reset'){if(!confirm('Redefinir a senha da matrícula '+m+'?'))return;const x=await api('resetPassword',{mat:m});$('#u-msg').innerHTML=`<div class="card" style="background:var(--warnbg)"><b>Nova senha temporária (${esc(m)}): <span class="mono">${esc(x.senha)}</span></b><br><span class="mut">Informe ao usuário. Não será exibida novamente; a troca é exigida no próximo acesso.</span></div>`}
      else if(k==='ativo')await api('setAtivo',{mat:m,ativo:b.dataset.a==='1'});
      else if(k==='del'){if(!confirm('Remover o usuário '+m+'?'))return;await api('removeUser',{mat:m})}
      loadUsers()}catch(e){toast(e.message)}})}
  catch(e){el.textContent='Falha ao carregar: '+e.message}}

/* ===== Início ===== */
(async function(){
  try{await DB.open();S=Object.assign(S,await DB.get('state')||{});const ar=await DB.get('series');if(ar)SERIES=new Map(ar.map(r=>[r[0],[r[1],r[2]]]));const es=await DB.get('escolas');if(es)setEscolas(es);const sv=await DB.get('servidores');if(sv)setServ(sv)}catch(e){toast('Armazenamento indisponível: os dados não serão salvos')}
  S.meta=Object.assign({url:DEFAULT_URL,session:'',user:null,device:'',lastPull:0,lastSync:0,lastAlmox:0},S.meta||{});delete S.meta.token;if(DEFAULT_URL)S.meta.url=DEFAULT_URL;
  if(S.meta.session){setFiscal();render();syncChip();if(navigator.onLine)setTimeout(()=>sync(false),2500)}else showLogin('');
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
